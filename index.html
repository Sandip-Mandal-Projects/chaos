 <canvas id="dust"></canvas><div id="shade"></div><div id="flash"></div>
</main>
<script>
(()=> {
 const scene=document.querySelector('#scene'),wrap=document.querySelector('#image-wrap'),eye=document.querySelector('#eye'),flash=document.querySelector('#flash');
 let tx=0,ty=0,x=0,y=0,lastTap=0;
 function point(px,py){tx=(px/innerWidth-.5)*2;ty=(py/innerHeight-.5)*2}
 addEventListener('pointermove',e=>point(e.clientX,e.clientY),{passive:true});
 addEventListener('touchmove',e=>{if(e.touches[0])point(e.touches[0].clientX,e.touches[0].clientY)},{passive:true});
 function animate(){
   x+=(tx-x)*.035;y+=(ty-y)*.035;
   const mobile=innerWidth<700;
   const amount=mobile?5:10;
   wrap.style.transform=`rotateY(${x*(mobile?1.0:1.5)}deg) rotateX(${-y*(mobile?.8:1.1)}deg)`;
   eye.style.transform=`translate3d(${x*amount}px,${-y*amount*.7}px,18px) scale(${1.012+Math.sin(performance.now()*.00065)*.004})`;
   requestAnimationFrame(animate);
 }
 animate();
 function pulse(){
   flash.animate([{opacity:0},{opacity:.13},{opacity:0}],{duration:520,easing:'ease-out'});
 }
 scene.addEventListener('pointerdown',e=>{
   point(e.clientX,e.clientY);
   const now=Date.now();
   if(now-lastTap<360)pulse();
   lastTap=now;
 });
 // Very subtle ambient particles; original artwork remains completely unobstructed.
 const c=document.querySelector('#dust'),ctx=c.getContext('2d');let w,h,dpr,stars=[];
 function resize(){
   dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;
   c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px';
   ctx.setTransform(dpr,0,0,dpr,0,0);
   const count=Math.min(95,Math.floor(w*h/15000));
   stars=Array.from({length:count},()=>({x:Math.random()*w,y:Math.random()*h,r:.35+Math.random()*.8,a:Math.random()*6.28,v:.035+Math.random()*.1}));
 }
 function draw(t){
   ctx.clearRect(0,0,w,h);
   for(const s of stars){
     s.y-=s.v;if(s.y<0){s.y=h;s.x=Math.random()*w}
     ctx.beginPath();ctx.arc(s.x+Math.sin(t*.00025+s.a)*3,s.y,s.r,0,Math.PI*2);
     ctx.fillStyle=`rgba(126,255,54,${.10+.16*(.5+.5*Math.sin(t*.0008+s.a))})`;ctx.fill();
   }
   requestAnimationFrame(draw);
 }
 addEventListener('resize',resize);resize();draw(0);
})();
</script>
